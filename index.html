<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LyProxy 代理库存</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .flag-ico{display:inline-block;vertical-align:-0.15em;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08);object-fit:cover;background:#f1f5f9}
  .flag-ph{display:inline-block;width:20px;text-align:center;color:#cbd5e1}

  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

<body class="bg-slate-50 text-slate-800">

<!-- ============ 登录 / 设置面板 ============ -->
<div id="authPanel" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">LyProxy 代理库存</h1>
    <p class="text-sm text-slate-500 mb-6">登录后实时读取你账号下的全部代理 IP</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">API 地址</label>
        <input id="apiBase" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg mono text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" value="https://ly-proxy.com/api/proxy">
        <p class="text-xs text-slate-400 mt-1">默认官方接口，如需走代理可在下方配置</p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">账号</label>
          <input id="username" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" placeholder="djh123" autocomplete="username">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">密码</label>
          <input id="password" type="password" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">验证码</label>
        <div class="flex gap-3 items-center">
          <input id="code" class="flex-1 px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" placeholder="输入计算结果，如 8*9=72" autocomplete="off">
          <img id="captchaImg" class="h-11 w-[136px] rounded border border-slate-200 cursor-pointer bg-slate-100 object-contain" title="点击刷新" alt="点击刷新">
        </div>
        <p class="text-xs text-slate-400 mt-1">点击图片刷新。如提示「验证码错误」，请刷新后重试</p>
      </div>

      <div id="authMsg" class="hidden text-sm px-3 py-2.5 rounded-lg"></div>

      <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">登录并读取</button>

      <div class="relative py-2">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
        <div class="relative flex justify-center"><span class="bg-white px-3 text-xs text-slate-400">或</span></div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">直接粘贴 Token</label>
        <input id="tokenInput" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg mono text-xs focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" placeholder="eyJhbGciOiJIUzM4NCJ9...">
        <button id="tokenBtn" class="mt-2 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-lg transition text-sm">用 Token 登录</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  配置
// ============================================================
const CONFIG = {
  apiBase: 'https://ly-proxy.com/api/proxy',
  pageSize: 100,          // 前端每页显示
  fetchPageSize: 1000,    // 后端单次拉取上限
  autoRefreshMs: 0,       // 自动刷新已关闭，只能手动点「刷新」
  storageKey: 'lyproxy_token',
};

// ============================================================
//  状态
// ============================================================
const S = {
  token: '',
  rows: [],
  filtered: [],
  page: 1,
  captchaUuid: '',
  apiBase: CONFIG.apiBase,
  timer: null,
  stoppedCount: 0,
  merchantId: null,
  sortMode: 'expire',   // 'expire' = 按到期时间倒序 | 'days' = 按剩余天数排
  sortDir: 'desc',      // 'desc' = 剩余天数多的在前 | 'asc' = 少的在前
  pageSize: 100,        // 每页条数，可在分页栏切换 20/50/100
  selected: new Set(),  // 多选：存 id（无 id 时退回 proxyStr）
};

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ============================================================
//  API
// ============================================================
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const res = await fetch(S.apiBase + path, { ...opts, headers });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('响应解析失败: ' + text.slice(0, 120)); }
  if (data.code === 401) { logout(); throw new Error('登录已失效'); }
  return data;
}

async function loadCaptcha() {
  try {
    const d = await api('/captchaImage');
    if (d.img) {
      $('captchaImg').src = 'data:image/png;base64,' + d.img;
      S.captchaUuid = d.uuid;
    }
  } catch (e) { console.warn('验证码加载失败', e); }
}

async function doLogin() {
  const username = $('username').value.trim();
  const password = $('password').value;
  const code = $('code').value.trim();
  if (!username || !password) return showMsg('请填写账号和密码', 'error');

  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const d = await api('/login', {
      method: 'POST',
      body: JSON.stringify({ username, password, code, uuid: S.captchaUuid, rememberMe: false })
    });
    if (d.token) {
      S.token = d.token;
      localStorage.setItem(CONFIG.storageKey, d.token);
      await boot();
    } else {
      showMsg(d.msg || '登录失败', 'error');
      loadCaptcha();
      $('code').value = '';
    }
  } catch (e) {
    showMsg(e.message, 'error');
    loadCaptcha();
  } finally {
    btn.disabled = false; btn.textContent = '登录并读取';
  }
}

async function useToken() {
  const t = $('tokenInput').value.trim().replace(/^Bearer\s+/i, '');
  if (!t) return showMsg('请粘贴 Token', 'error');
  S.token = t;
  localStorage.setItem(CONFIG.storageKey, t);
  await boot();
}

// ============================================================
//  数据
// ============================================================
async function fetchAll(includeStopped) {
  const all = [];
  let page = 1;
  while (page <= 30) {
    // 不带 includeStopped 时服务端按 status=1 过滤，只要正常在线的
    const q = includeStopped ? '' : '&status=1';
    const d = await api(`/admin/ip/merchant/list?pageNum=${page}&pageSize=${CONFIG.fetchPageSize}${q}`);
    if (!d.rows || !d.rows.length) break;
    all.push(...d.rows);
    const total = d.total || 0;
    setSyncText(`拉取中 ${all.length}/${total}`);
    if (all.length >= total) break;
    page++;
  }
  return all;
}

async function refresh(includeStopped) {
  const icon = $('refreshIcon');
  icon.classList.add('animate-spin');
  try {
    const wantAll = includeStopped === true;
    const rows = await fetchAll(wantAll);
    S.rows = rows;
    // 服务端已过滤；这里兜一层，防止后端忽略 status 参数
    if (!wantAll) S.rows = S.rows.filter(r => String(r.status) === '1');
    render();
    const now = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    $('statSync').textContent = now;
  } catch (e) {
    console.error(e);
    alert('刷新失败：' + e.message);
  } finally {
    icon.classList.remove('animate-spin');
  }
}

function setSyncText(t) { $('statSync').textContent = t; }

// ============================================================
//  渲染
// ============================================================
const TYPE_MAP = { '1': 'ISP住宅/原生', '0': '机房', '3': '双ISP' };
const STATUS_MAP = { '1': ['正常', 'text-emerald-700 bg-emerald-50'], '2': ['已停止', 'text-rose-700 bg-rose-50'], '0': ['异常', 'text-amber-700 bg-amber-50'] };

// 地区中文名 + 国旗 emoji（flag 由两位国家码用 Regional Indicator 拼出，无需图片资源）
const CC_CN = {
  AE: '阿联酋', AU: '澳大利亚', BE: '比利时', BR: '巴西', CA: '加拿大', CH: '瑞士', CL: '智利',
  CN: '中国', CZ: '捷克', DE: '德国', DK: '丹麦', EE: '爱沙尼亚', ES: '西班牙', FI: '芬兰',
  FR: '法国', GB: '英国', GR: '希腊', HK: '中国香港', HR: '克罗地亚', HU: '匈牙利', ID: '印度尼西亚',
  IE: '爱尔兰', IL: '以色列', IN: '印度', IT: '意大利', JP: '日本', KR: '韩国', LT: '立陶宛',
  LU: '卢森堡', LV: '拉脱维亚', MX: '墨西哥', MY: '马来西亚', NG: '尼日利亚', NL: '荷兰',
  NO: '挪威', NZ: '新西兰', PH: '菲律宾', PL: '波兰', PT: '葡萄牙', RO: '罗马尼亚', RS: '塞尔维亚',
  RU: '俄罗斯', SA: '沙特阿拉伯', SE: '瑞典', SG: '新加坡', SK: '斯洛伐克', TH: '泰国',
  TR: '土耳其', TW: '中国台湾', UA: '乌克兰', US: '美国', VN: '越南', ZA: '南非', XX: '未知',
};
// 国旗用 SVG 图片渲染：Windows 的 Segoe UI Emoji 不含国旗字形，emoji 方案在 Win 上必然空白。
// 主源 flagcdn.jsdelivr 镜像，失败回退 flagcdn.com，再失败回退 🏳️ 文本。
function flagImg(cc, size) {
  const w = size || 20;
  if (!cc || cc.length !== 2 || cc === 'XX') return '<span class="flag-ph">🏳️</span>';
  const c = cc.toLowerCase();
  const u1 = `https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/4x3/${c}.svg`;
  const u2 = `https://flagcdn.com/${c}.svg`;
  return `<img class="flag-ico" width="${w}" height="${Math.round(w * 0.75)}" src="${u1}" alt="${esc(cc)}" loading="lazy" onerror="this.onerror=null;this.src='${u2}'">`;
}
function regionLabel(cc, loc) {
  const cn = CC_CN[cc] || cc || '';
  return { flag: flagImg(cc), cn, loc: loc || '' };
}

function applyFilter() {
  const q = $('search').value.trim().toLowerCase();
  const fc = $('fCountry').value;
  const ft = $('fType').value;
  const fs = $('fStatus').value;
  const fsrc = $('fSource').value;

  S.filtered = S.rows.filter(r => {
    if (fc && r.countryCode !== fc) return false;
    if (ft && String(r.type) !== ft) return false;
    if (fs && String(r.status) !== fs) return false;
    if (fsrc === 'ipnux' && !r.ipnuxProxyId) return false;
    if (fsrc === 'local' && r.ipnuxProxyId) return false;
    if (q) {
      const hay = [r.ip, r.account, r.location, r.countryCode, r.port].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  S.page = 1;
  // 排序：默认到期时间最晚的排第一；点「剩余天数」切换为按剩余天数升序/降序
  const tOf = r => Date.parse((r.expireDatetime || '').replace(' ', 'T')) || 0;
  if (S.sortMode === 'days') {
    const dir = S.sortDir === 'asc' ? 1 : -1;   // asc = 剩余天数从少到多
    S.filtered.sort((a, b) => dir * (tOf(a) - tOf(b)));
  } else {
    S.filtered.sort((a, b) => tOf(b) - tOf(a));
  }
  renderTable();
}

function render() {
  // 统计
  const total = S.rows.length;
  const now = Date.now();
  const expiring7 = S.rows.filter(r => {
    const t = Date.parse((r.expireDatetime || '').replace(' ', 'T'));
    return t && t > now && t - now < 7 * 864e5;
  }).length;
  const expiring30 = S.rows.filter(r => {
    const t = Date.parse((r.expireDatetime || '').replace(' ', 'T'));
    return t && t > now && t - now < 30 * 864e5;
  }).length;
  const countries = new Set(S.rows.map(r => r.countryCode).filter(Boolean));

  $('statTotal').textContent = total;
  $('statOnline').textContent = S.stoppedCount || '—';
  $('statOffline').textContent = expiring7;
  $('statCountry').textContent = countries.size;
  $('statExpiring').textContent = expiring30;

  // 国家下拉
  const sel = $('fCountry');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>';
  const ccCount = {};
  S.rows.forEach(r => { if (r.countryCode) ccCount[r.countryCode] = (ccCount[r.countryCode] || 0) + 1; });
  Object.entries(ccCount).sort((a, b) => b[1] - a[1]).forEach(([cc, n]) => {
    const o = document.createElement('option');
    o.value = cc;
    o.textContent = '';
    o.innerHTML = `${flagImg(cc, 18)} ${esc(CC_CN[cc] || cc)} (${n})`;
    sel.appendChild(o);
  });
  sel.value = cur;

  applyFilter();
}

function renderTable() {
  const tb = $('tbody');
  tb.innerHTML = '';
  const PS = S.pageSize || CONFIG.pageSize;
  const start = (S.page - 1) * PS;
  const pageRows = S.filtered.slice(start, start + PS);
  const totalPages = Math.max(1, Math.ceil(S.filtered.length / PS));

  if (!pageRows.length) {
    tb.appendChild(el('tr', '', `<td colspan="9" class="px-4 py-12 text-center text-slate-400">没有匹配的记录</td>`));  } else {
    pageRows.forEach(r => {
      const tr = document.createElement('tr');
      tr.className = 'border-b border-slate-100 transition';
      const typeName = TYPE_MAP[String(r.type)] || (r.type == null ? '—' : 'type=' + r.type);
      const src = r.ipnuxProxyId ? 'IPNux' : '本地';
      const srcCls = r.ipnuxProxyId ? 'bg-violet-50 text-violet-700' : 'bg-slate-100 text-slate-600';
      const [stName, stCls] = STATUS_MAP[String(r.status)] || ['未知', 'bg-slate-100 text-slate-600'];
      const exp = (r.expireDatetime || '').slice(0, 10);

      // 剩余天数
      const expTs = Date.parse((r.expireDatetime || '').replace(' ', 'T'));
      let daysLeft = null, daysTxt = '—', daysCls = 'text-slate-400';
      if (expTs) {
        daysLeft = Math.ceil((expTs - Date.now()) / 864e5);
        if (daysLeft > 7) { daysTxt = daysLeft + ' 天'; daysCls = 'text-emerald-600 font-semibold'; }
        else if (daysLeft >= 0) { daysTxt = daysLeft + ' 天'; daysCls = 'text-orange-500 font-semibold'; }
        else { daysTxt = '已过期 ' + Math.abs(daysLeft) + ' 天'; daysCls = 'text-rose-600 font-semibold'; }
      }

      const rg = regionLabel(r.countryCode, r.location);
      const proxyStr = `${r.ip}:${r.port}:${r.account}:${r.password}`;
      const rowKey = r.id != null ? 'id:' + r.id : 'p:' + proxyStr;
      const checked = S.selected.has(rowKey) ? 'checked' : '';

      tr.innerHTML = `
        <td class="px-3 py-2.5"><input type="checkbox" class="rowCheck cursor-pointer" data-key="${esc(rowKey)}" ${checked}></td>
        <td class="px-4 py-2.5 mono text-slate-900 whitespace-nowrap">${esc(proxyStr)}</td>
        <td class="px-4 py-2.5 text-slate-600 whitespace-nowrap"><span class="mr-1 align-middle">${rg.flag}</span>${esc(rg.cn)}${rg.loc ? ' <span class="text-slate-400 text-xs">' + esc(rg.loc) + '</span>' : ''}</td>
        <td class="px-4 py-2.5 text-slate-600">${esc(typeName)}</td>
        <td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded text-xs ${srcCls}">${src}</span></td>
        <td class="px-4 py-2.5 text-slate-500 text-xs whitespace-nowrap">${esc(exp)}</td>
        <td class="px-4 py-2.5 text-xs whitespace-nowrap ${daysCls}">${daysTxt}</td>
        <td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded text-xs ${stCls}">${stName}</span></td>
        <td class="px-4 py-2.5 text-right whitespace-nowrap">
          <button class="copyBtn text-blue-600 hover:text-blue-800 text-xs font-medium" data-proxy="${esc(proxyStr)}">复制</button>
        </td>`;
      tb.appendChild(tr);
    });

    tb.querySelectorAll('.copyBtn').forEach(b => {
      b.addEventListener('click', () => {
        const text = b.dataset.proxy;
        copyText(text);
        const old = b.textContent;
        b.textContent = '已复制 ✓';
        b.classList.add('text-emerald-600');
        setTimeout(() => { b.textContent = old; b.classList.remove('text-emerald-600'); }, 1200);
      });
    });

    // 行内多选
    tb.querySelectorAll('.rowCheck').forEach(cb => {
      cb.addEventListener('change', () => {
        const k = cb.dataset.key;
        if (cb.checked) S.selected.add(k); else S.selected.delete(k);
        updateSelUI(pageRows);
      });
    });
  }

  updateSelUI(pageRows);

  $('rangeInfo').textContent = S.filtered.length
    ? `显示第 ${start + 1} - ${Math.min(start + PS, S.filtered.length)} 条，共 ${S.filtered.length} 条`
    : '共 0 条';
  $('pageNow').textContent = `${S.page} / ${totalPages}`;
  $('prevBtn').disabled = S.page <= 1;
  $('nextBtn').disabled = S.page >= totalPages;
}

// ============================================================
//  多选 / 批量复制
// ============================================================
function rowKeyOf(r) {
  return r.id != null ? 'id:' + r.id : 'p:' + `${r.ip}:${r.port}:${r.account}:${r.password}`;
}
function proxyOf(r) {
  return `${r.ip}:${r.port}:${r.account}:${r.password}`;
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { console.warn(e); }
  document.body.removeChild(ta);
}

// 更新「已选 N 条」与全选框的选中态
function updateSelUI(pageRows) {
  const n = S.selected.size;
  $('selCount').textContent = n;
  $('selInfo').className = n > 0
    ? 'text-slate-500'
    : 'text-slate-500 hidden';
  const rows = pageRows || S.filtered.slice((S.page - 1) * (S.pageSize || 100), S.page * (S.pageSize || 100));
  const allChecked = rows.length > 0 && rows.every(r => S.selected.has(rowKeyOf(r)));
  const someChecked = rows.some(r => S.selected.has(rowKeyOf(r)));
  const ca = $('checkAll');
  ca.checked = allChecked;
  ca.indeterminate = !allChecked && someChecked;
}

// 全选/取消全选当前页
function toggleCheckAll(checked) {
  const PS = S.pageSize || CONFIG.pageSize;
  const rows = S.filtered.slice((S.page - 1) * PS, S.page * PS);
  rows.forEach(r => {
    const k = rowKeyOf(r);
    if (checked) S.selected.add(k); else S.selected.delete(k);
  });
  renderTable();
}

// 批量复制：按当前排序顺序输出，每行 ip:port:account:password
function copySelected() {
  if (!S.selected.size) return;
  const lines = S.filtered
    .filter(r => S.selected.has(rowKeyOf(r)))
    .map(proxyOf);
  // 若选中项有落在筛选结果之外的（改过筛选），按 S.rows 兜底补齐
  if (lines.length < S.selected.size) {
    S.rows.forEach(r => {
      if (S.selected.has(rowKeyOf(r)) && !lines.includes(proxyOf(r))) lines.push(proxyOf(r));
    });
  }
  copyText(lines.join('\n'));
  const btn = $('copySelBtn');
  const old = btn.textContent;
  btn.textContent = `已复制 ${lines.length} 条 ✓`;
  setTimeout(() => { btn.textContent = old; }, 1600);
}

// ============================================================
//  导出
// ============================================================
function exportCSV() {
  const head = ['代理(IP:端口:账号:密码)', '地区', '城市/机房', '品类', '来源', '到期', '剩余天数', '状态'];
  const lines = [head.join(',')];
  const q = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  S.filtered.forEach(r => {
    const expTs = Date.parse((r.expireDatetime || '').replace(' ', 'T'));
    const dl = expTs ? Math.ceil((expTs - Date.now()) / 864e5) : '';
    lines.push([
      `${r.ip}:${r.port}:${r.account}:${r.password}`,
      CC_CN[r.countryCode] || r.countryCode || '',
      r.location || '',
      TYPE_MAP[String(r.type)] || (r.type == null ? '' : 'type=' + r.type),
      r.ipnuxProxyId ? 'IPNux' : '本地',
      (r.expireDatetime || '').slice(0, 10),
      dl,
      String(r.status) === '1' ? '正常' : (String(r.status) === '2' ? '已停止' : '异常'),
    ].map(q).join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lyproxy-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function showMsg(text, kind) {
  const m = $('authMsg');
  m.textContent = text;
  m.className = 'text-sm px-3 py-2.5 rounded-lg ' + (kind === 'error' ? 'bg-rose-50 text-rose-700' : 'bg-blue-50 text-blue-700');
}

async function boot() {
  try {
    const info = await api('/getInfo');
    if (info.code === 200 && info.user) {
      $('authPanel').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('userLine').textContent = `${info.user.userName || ''} · ${(info.roles || []).join('/')}`;
      await refresh();
      await loadWallet();
      // 自动刷新已关闭：只允许手动点「刷新」按钮
    } else {
      throw new Error(info.msg || '鉴权失败');
    }
  } catch (e) {
    showMsg('Token 无效或已过期：' + e.message, 'error');
    localStorage.removeItem(CONFIG.storageKey);
    S.token = '';
  }
}

function logout() {
  S.token = '';
  localStorage.removeItem(CONFIG.storageKey);
  clearInterval(S.timer);
  $('app').classList.add('hidden');
  $('authPanel').classList.remove('hidden');
  loadCaptcha();
}

//  购买新 IP
// ============================================================
const BUY = {
  rows: [],          // 可购买 IP 池
  selected: new Set(),
  page: 1,
  pageSize: 20,
  country: '',
  loading: false,
};

async function openBuy() {
  $('buyModal').classList.remove('hidden');
  BUY.selected.clear();
  BUY.page = 1;
  $('buyDays').value = '30';
  await loadBuyRegions();
}

function closeBuy() { $('buyModal').classList.add('hidden'); }

async function loadBuyRegions() {
  // 池子列表 = 可购买的国家/地区货源
  try {
    const d = await api('/admin/ip/pool/regionalAvailableIps?pageNum=1&pageSize=200');
    if (d.code === 200) {
      const rows = d.rows || [];
      const sel = $('buyRegion');
      sel.innerHTML = '<option value="">全部地区</option>';
      rows.forEach(r => {
        const o = document.createElement('option');
        o.value = r.id ?? r.poolId ?? r.countryCode ?? '';
        o.textContent = `${r.countryCode || r.country || ''} ${r.location || r.originalName || ''} (${r.available ?? r.count ?? '?'})`;
        sel.appendChild(o);
      });
    }
  } catch (e) { console.warn('地区加载失败', e); }
  await loadBuyIps();
}

async function loadBuyIps() {
  BUY.loading = true;
  $('buyTbody').innerHTML = `<tr><td colspan="5" class="px-4 py-10 text-center text-slate-400">加载中...</td></tr>`;
  try {
    const params = new URLSearchParams({
      pageNum: BUY.page, pageSize: BUY.pageSize,
    });
    if (BUY.country) params.set('countryCode', BUY.country);
    const d = await api('/admin/ip/pool/regionalAvailableIps?' + params);
    if (d.code !== 200) throw new Error(d.msg || '读取失败');
    BUY.rows = d.rows || [];
    renderBuyTable(d.total || BUY.rows.length);
  } catch (e) {
    $('buyTbody').innerHTML = `<tr><td colspan="5" class="px-4 py-10 text-center text-rose-500">${esc(e.message)}</td></tr>`;
  } finally {
    BUY.loading = false;
  }
}

function renderBuyTable(total) {
  const tb = $('buyTbody');
  tb.innerHTML = '';
  if (!BUY.rows.length) {
    tb.innerHTML = `<tr><td colspan="5" class="px-4 py-10 text-center text-slate-400">该条件暂无可购买 IP</td></tr>`;
  } else {
    BUY.rows.forEach(r => {
      const ip = r.ip || '';
      const tr = document.createElement('tr');
      tr.className = 'border-b border-slate-100';
      tr.innerHTML = `
        <td class="px-3 py-2"><input type="checkbox" class="buyChk rounded" data-ip="${esc(ip)}" ${BUY.selected.has(ip) ? 'checked' : ''}></td>
        <td class="px-3 py-2 mono">${esc(ip)}</td>
        <td class="px-3 py-2">${esc(r.countryCode || r.country || '—')} ${esc(r.location || '')}</td>
        <td class="px-3 py-2">${esc(r.typeName || r.type || '—')}</td>
        <td class="px-3 py-2 text-xs text-slate-500">${esc(r.price || r.pricePerMonth || '—')}</td>`;
      tb.appendChild(tr);
    });
    tb.querySelectorAll('.buyChk').forEach(c => {
      c.addEventListener('change', () => {
        if (c.checked) BUY.selected.add(c.dataset.ip); else BUY.selected.delete(c.dataset.ip);
        updateBuyCount();
      });
    });
  }
  $('buyRange').textContent = `共 ${total} 条可选`;
  updateBuyCount();
}

function updateBuyCount() {
  $('buySelCount').textContent = BUY.selected.size;
  $('submitBuyBtn').disabled = BUY.selected.size === 0;
}

async function submitBuy() {
  const days = parseInt($('buyDays').value) || 30;
  const ips = [...BUY.selected];
  if (!ips.length) return alert('请先勾选 IP');

  const est = (days / 30 * ips.length).toFixed(2);
  if (!confirm(`确认购买 ${ips.length} 个 IP，周期 ${days} 天？\n约 ${est} 个计费单位，提交后从余额扣款。`)) return;

  $('submitBuyBtn').disabled = true;
  $('submitBuyBtn').textContent = '提交中...';
  try {
    const d = await api('/admin/order/addStatic', {
      method: 'POST',
      body: JSON.stringify({ days, ips, ipPoolIds: BUY.poolIds || {}, merchantId: S.merchantId || null }),
    });
    if (d.code === 200) {
      alert('下单成功，稍后刷新列表即可看到新 IP');
      closeBuy();
      refresh();
    } else {
      // 403 = 账号没有下单权限，引导去官网
      if (d.code === 403) {
        const go = confirm('当前账号没有下单权限（需管理员或代理商角色）。\n\n是否跳转到官网控制台手动购买？');
        if (go) window.open('https://ly-proxy.com/client/ip/static?tab=buy', '_blank');
        return;
      }
      alert('下单失败：' + (d.msg || '未知错误'));
    }
  } catch (e) {
    alert('下单失败：' + e.message);
  } finally {
    $('submitBuyBtn').disabled = false;
    $('submitBuyBtn').textContent = '确认购买';
  }
}

// ============================================================
//  账户信息（余额栏已移除，只保留 merchantId 供必要时内部使用）

async function loadWallet() {
  try {
    const d = await api('/client/merchant/walletInfo');
    if (d.code === 200 && d.data) S.merchantId = d.data.merchantId || null;
  } catch (e) {
    console.warn('账户信息读取失败', e);
  }
}

function toggleStopped() {
  const sel = $('fStatus');
  const showAll = sel.value === '1';   // 当前只显示正常 → 切成全部
  sel.value = showAll ? '' : '1';
  const btn = $('showStoppedBtn');
  btn.textContent = showAll ? '仅看正常' : '显示已停止';
  btn.className = showAll
    ? 'px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm rounded-lg transition'
    : 'px-3 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm rounded-lg transition';
  if (showAll) {
    // 需要全量数据才看得到已停止的，重新拉一次不带 status 的全量
    refresh(true);
  } else {
    render();
  }
}

$('buyNextBtn').addEventListener('click', () => { BUY.page++; loadBuyIps(); });
$('submitBuyBtn').addEventListener('click', submitBuy);
$('prevBtn').addEventListener('click', () => { if (S.page > 1) { S.page--; renderTable(); } });
$('nextBtn').addEventListener('click', () => {
  const PS = S.pageSize || CONFIG.pageSize;
  const totalPages = Math.max(1, Math.ceil(S.filtered.length / PS));
  if (S.page < totalPages) { S.page++; renderTable(); }
});
// 每页条数
$('pageSizeSel').addEventListener('change', e => {
  S.pageSize = parseInt(e.target.value, 10) || 100;
  S.page = 1;
  renderTable();
});
// 跳转到指定页
function doJump() {
  const PS = S.pageSize || CONFIG.pageSize;
  const totalPages = Math.max(1, Math.ceil(S.filtered.length / PS));
  let p = parseInt($('jumpPage').value, 10);
  if (!p || p < 1) return;
  if (p > totalPages) p = totalPages;
  S.page = p;
  $('jumpPage').value = '';
  renderTable();
}
$('jumpBtn').addEventListener('click', doJump);
$('jumpPage').addEventListener('keydown', e => { if (e.key === 'Enter') doJump(); });
// 剩余天数排序：第一次点 = 少的在前（asc），再点 = 多的在前（desc），第三次回到按到期时间倒序
$('daysSortBtn').addEventListener('click', () => {
  if (S.sortMode === 'expire') { S.sortMode = 'days'; S.sortDir = 'asc'; }
  else if (S.sortDir === 'asc') { S.sortDir = 'desc'; }
  else { S.sortMode = 'expire'; }
  $('daysSortIcon').textContent = S.sortMode === 'days' ? (S.sortDir === 'asc' ? '▲' : '▼') : '▼';
  $('daysSortIcon').className = S.sortMode === 'days' ? 'text-blue-600' : 'text-slate-400';
  applyFilter();
});
['search', 'fCountry', 'fType', 'fStatus', 'fSource'].forEach(id => {
  $(id).addEventListener('input', applyFilter);
  $(id).addEventListener('change', applyFilter);
});
$('clearFilter').addEventListener('click', () => {
  $('search').value = ''; $('fCountry').value = ''; $('fType').value = '';
  $('fStatus').value = '1'; $('fSource').value = '';
  applyFilter();
});
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// 启动
loadCaptcha();
// API 地址可在登录面板覆盖（换代理时用）
$('apiBase').addEventListener('change', e => {
  const v = e.target.value.trim().replace(/\/+$/, '');
  if (v) { S.apiBase = v; loadCaptcha(); }
});
const saved = localStorage.getItem(CONFIG.storageKey);
if (saved) { S.token = saved; boot(); }
</script>
</body>
